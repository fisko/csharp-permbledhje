name: Kompilimi i të gjitha detyrave

on:
  push:
    branches: [ main, zgjidhje ]
  pull_request:
    branches: [ main, zgjidhje ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalo .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilo çdo projekt
        run: |
          deshtime=0
          while IFS= read -r proj; do
            echo "--- $proj"
            dotnet build "$proj" -v q --nologo || deshtime=$((deshtime+1))
          done < <(find src zgjidhje -name "*.csproj" 2>/dev/null | sort)
          echo "Dështime: $deshtime"
          [ "$deshtime" -eq 0 ]
